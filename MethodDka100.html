        <div class="input-field">

            if (typeof Decimal === 'undefined') {
                alert('エラー: 同じフォルダ内に decimal.js が見つかりません。');
                return;

            Decimal.set({ precision: 100 });

            if (isNaN(offline_n) || offline_n <= 0) {

            offline_sa = [];
            offline_sr = new Array(offline_n + 1);
            offline_si = new Array(offline_n + 1);
            offline_actualLoops = 0;

            // 【バグ根絶】画面内の各ボックスのID（coefficient_i）から、現在の入力値を確実にパースして取得
            for (var i = 0; i <= offline_n; i++) {
                var rawValue = document.getElementById('coefficient_' + i).value.trim();
                try { offline_sa[i] = new Decimal(rawValue || "0"); }
                catch (e) { alert((offline_n - i) + '次の係数の入力形式が正しくありません。'); return; }
            }

            if (offline_sa[0].isZero()) {
                alert('最高次の係数 (a_n) に 0 は指定できません。');
                return;

                var card = document.createElement('article');
                card.className = 'result-card';

                h += '<div style="margin-top:8px;"><strong>虚部 (Imaginary Part):</strong><div class="result-value">' + offline_si[i].toFixed(100) + '</div></div>';

                card.innerHTML = h;
                resultsDiv.appendChild(card);
            }
        }

        function subroutine() {
            var sx = Array.from({ length: offline_n + 1 }, function () { return new Decimal(0); });
            var sy = Array.from({ length: offline_n + 1 }, function () { return new Decimal(0); });

            var se = new Decimal("1e-95");
            var maxIts = 500;
            var pi = Decimal.acos(-1);
            var sw = new Decimal(0);

            // 【バグ根絶】先頭要素[0]をピンポイント指定して、多項式の正規化を正確に執行
            var lc = new Decimal(offline_sa_norm[0]);

            }

                if (sw.lt(sq)) sw = sq;
            }
            if (sw.isZero()) sw = new Decimal(1);

            var sb = pi.mul(2).div(new Decimal(offline_n));
            var sc = pi.div(new Decimal(2 * offline_n));
            for (var j = 1; j <= offline_n; j++) {
                var st = sb.mul(new Decimal(j - 1)).add(sc);
                offline_sr[j] = sw.mul(Decimal.cos(st));
                offline_si[j] = sw.mul(Decimal.sin(st));

            for (var k = 1; k <= maxIts; k++) {
                var bContinue = false;
                for (var i = 1; i <= offline_n; i++) {

                        s2 = s1.mul(ci).add(s2.mul(bi));
                        s1 = s5.add(offline_sa_norm[j]);

                        if (j !== i) {
                            var dx = bi.sub(offline_sr[j]);
                            var dy = ci.sub(offline_si[j]);
                            s5 = s3.mul(dx).sub(s4.mul(dy));
                            s4 = s3.mul(dy).add(s4.mul(dx));
                            s3 = s5;
                        }
                    }

                    var den = s3.pow(2).add(s4.pow(2));
                    if (den.isZero()) den = new Decimal("1e-50");

                    sx[i] = s1.mul(s3).add(s2.mul(s4)).div(den);
                    sy[i] = s2.mul(s3).sub(s1.mul(s4)).div(den);

                    offline_sr[i] = offline_sr[i].sub(sx[i]);
                    offline_si[i] = offline_si[i].sub(sy[i]);
                    if (sx[i].abs().gt(se) || sy[i].abs().gt(se)) bContinue = true;
                }
                offline_actualLoops = k;
                if (!bContinue) { offline_bSyuusoku = true; return; }
            }
            offline_bSyuusoku = false;
        }
